name: CodeQL Security Analysis
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311
