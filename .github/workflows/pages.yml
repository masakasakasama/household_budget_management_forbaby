name: Deploy to GitHub Pages

# Webアプリを GitHub Pages に公開し、スマホから開ける共有リンクを用意する
on:
  push:
    branches:
      - main
      - claude/cute-budget-app-zVv6p
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは1つに絞る
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Set only after admin backup/restore and both real accounts have passed validation.
    if: ${{ vars.FIREBASE_MIGRATION_VERIFIED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select public site files only
        run: |
          mkdir public
          cp index.html app.js style.css sync-config.js data-backup.js sw.js version.json public/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
