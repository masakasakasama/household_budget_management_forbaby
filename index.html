<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#ffd1dc" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Baby家計簿" />
  <title>Baby家計簿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=1.5.2" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="mascot-strip" aria-hidden="true">🍼 🧸 ⭐ 🌙 💕</div>
      <h1 class="app-title">Baby家計簿</h1>
      <p class="app-subtitle">使った分と残せる分がすぐ見える家計簿</p>

      <div class="month-bar">
        <button class="month-nav" id="prevMonth" aria-label="前の月">‹</button>
        <div class="month-display">
          <input type="month" id="monthPicker" class="month-picker" />
          <span class="month-cloud" id="monthLabel">2026年6月</span>
        </div>
        <button class="month-nav" id="nextMonth" aria-label="次の月">›</button>
      </div>

      <span class="sync-status app-hidden" id="syncStatus" title="同期の状態">接続中</span>
      <span class="sync-time app-hidden" id="syncTime"></span>
    </header>

    <section class="highlight-row">
      <div class="hl-card hl-income">
        <span class="hl-emoji">💰</span>
        <span class="hl-label">カテゴリ上限合計</span>
        <span class="hl-value" id="hlIncome">¥0</span>
      </div>
      <div class="hl-card hl-expense">
        <span class="hl-emoji">🧾</span>
        <span class="hl-label">すでに使った金額</span>
        <span class="hl-value" id="hlExpense">¥0</span>
      </div>
      <div class="hl-card hl-balance">
        <span class="hl-emoji">🌱</span>
        <span class="hl-label">今月の残り</span>
        <span class="hl-value" id="hlBalance">¥0</span>
        <span class="hl-note" id="balanceNote">上限までの残り</span>
      </div>
    </section>

    <section class="card quick-add-card">
      <div class="card-head">
        <span class="card-emoji">+</span>
        <h2>支出を追加</h2>
      </div>
      <form class="quick-add" id="quickAddForm">
        <label>
          <span>日</span>
          <select id="quickDay"></select>
        </label>
        <label>
          <span>カテゴリ</span>
          <select id="quickCategory"></select>
        </label>
        <label>
          <span>金額</span>
          <input id="quickAmount" type="number" inputmode="numeric" min="0" placeholder="0" />
        </label>
        <button type="submit">追加</button>
      </form>
    </section>

    <div class="columns">
      <div class="col">
        <section class="card card-piggy">
          <div class="card-head">
            <span class="card-emoji">🐷</span>
            <h2>今月のペース</h2>
          </div>
          <p class="piggy-msg" id="piggyMsg">読み込み中...</p>
          <div class="piggy-meter">
            <div class="piggy-fill" id="piggyFill"></div>
          </div>
          <p class="piggy-rate" id="piggyRate"></p>
          <div class="saving-box">
            <span>残せる予定</span>
            <strong id="savingTarget">¥0</strong>
          </div>
        </section>

        <section class="card card-fixed">
          <div class="card-head">
            <span class="card-emoji">🏠</span>
            <h2>カテゴリ上限</h2>
          </div>
          <div class="line-list" id="fixedList"></div>
          <button class="add-line" data-target="fixed">＋カテゴリ上限を追加</button>
          <div class="subtotal">
            <span>カテゴリ上限合計</span>
            <span id="fixedTotal">¥0</span>
          </div>
        </section>

        <section class="card card-special">
          <div class="card-head">
            <span class="card-emoji">🍰</span>
            <h2>カテゴリ別の使い方</h2>
          </div>
          <div class="category-chart" id="categoryChart"></div>
        </section>

      </div>

      <div class="col">
        <section class="card card-credit">
          <div class="card-head">
            <span class="card-emoji">🧺</span>
            <h2>すでに使ったやつ</h2>
          </div>
          <div class="expense-list" id="creditBody"></div>
          <div class="subtotal">
            <span>使用済み合計</span>
            <span id="creditTotal">¥0</span>
          </div>
        </section>

      </div>
    </div>

    <footer class="app-footer">
      <span class="save-hint" id="saveHint">自動で保存されます</span>
    </footer>
  </div>

  <script src="sync-config.js?v=1.5.2"></script>
  <script src="app.js?v=1.5.2"></script>
</body>
</html>
