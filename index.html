<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#ffd1dc" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Baby家計簿" />
  <title>Baby家計簿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=1.3.0" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="mascot-strip" aria-hidden="true">🍼 🧸 ⭐ 🌙 💕</div>
      <h1 class="app-title">Baby家計簿</h1>
      <p class="app-subtitle">6月の上限と、すでに使った金額をかわいく管理</p>

      <div class="month-bar">
        <button class="month-nav" id="prevMonth" aria-label="前の月">‹</button>
        <div class="month-display">
          <input type="month" id="monthPicker" class="month-picker" />
          <span class="month-cloud" id="monthLabel">2026年6月</span>
        </div>
        <button class="month-nav" id="nextMonth" aria-label="次の月">›</button>
      </div>

      <div class="sync-bar">
        <span class="sync-status" id="syncStatus" title="同期の状態">ローカル保存</span>
        <div class="sync-actions">
          <button class="sync-btn" id="shareBtn" title="彼女と同じデータを見るリンクを作る">共有リンク</button>
          <button class="sync-btn sync-btn-main" id="refreshBtn" title="最新データを確認">今すぐ更新</button>
        </div>
        <span class="sync-time" id="syncTime"></span>
      </div>
    </header>

    <section class="highlight-row">
      <div class="hl-card hl-income">
        <span class="hl-emoji">💰</span>
        <span class="hl-label">毎月使う上限</span>
        <span class="hl-value" id="hlIncome">¥0</span>
      </div>
      <div class="hl-card hl-expense">
        <span class="hl-emoji">🧾</span>
        <span class="hl-label">すでに使った金額</span>
        <span class="hl-value" id="hlExpense">¥0</span>
      </div>
      <div class="hl-card hl-balance">
        <span class="hl-emoji">🌱</span>
        <span class="hl-label">今月の残り</span>
        <span class="hl-value" id="hlBalance">¥0</span>
        <span class="hl-note" id="balanceNote">上限までの残り</span>
      </div>
    </section>

    <div class="columns">
      <div class="col">
        <section class="card card-income">
          <div class="card-head">
            <span class="card-emoji">🎀</span>
            <h2>毎月使う上限</h2>
          </div>
          <div class="line-list" id="incomeList"></div>
          <button class="add-line" data-target="income">＋上限を追加</button>
          <div class="subtotal">
            <span>上限合計</span>
            <span id="incomeTotal">¥0</span>
          </div>
        </section>

        <section class="card card-fixed">
          <div class="card-head">
            <span class="card-emoji">🏠</span>
            <h2>カテゴリ上限</h2>
          </div>
          <div class="line-list" id="fixedList"></div>
          <button class="add-line" data-target="fixed">＋カテゴリ上限を追加</button>
          <div class="subtotal">
            <span>カテゴリ上限合計</span>
            <span id="fixedTotal">¥0</span>
          </div>
        </section>

        <section class="card card-memo">
          <div class="card-head">
            <span class="card-emoji">📝</span>
            <h2>memo</h2>
          </div>
          <textarea id="memo" class="memo-area" placeholder="6月のメモを書く"></textarea>
        </section>
      </div>

      <div class="col">
        <section class="card card-credit">
          <div class="card-head">
            <span class="card-emoji">🧺</span>
            <h2>すでに使ったやつ</h2>
          </div>
          <div class="table-wrap">
            <table class="data-table" id="creditTable">
              <thead>
                <tr>
                  <th></th>
                  <th>6月</th>
                  <th>カテゴリ</th>
                  <th>メモ</th>
                  <th class="num">金額</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="creditBody"></tbody>
            </table>
          </div>
          <button class="add-line" data-target="credit">＋支出を追加</button>
          <div class="subtotal">
            <span>使用済み合計</span>
            <span id="creditTotal">¥0</span>
          </div>
        </section>

        <section class="card card-living">
          <div class="card-head">
            <span class="card-emoji">📅</span>
            <h2>日別まとめ</h2>
          </div>
          <div class="line-list" id="livingList"></div>
          <div class="subtotal">
            <span>画像2の合計</span>
            <span id="livingTotal">¥0</span>
          </div>
        </section>

        <section class="card card-piggy">
          <div class="card-head">
            <span class="card-emoji">🐷</span>
            <h2>今月のペース</h2>
          </div>
          <p class="piggy-msg" id="piggyMsg">読み込み中...</p>
          <div class="piggy-meter">
            <div class="piggy-fill" id="piggyFill"></div>
          </div>
          <p class="piggy-rate" id="piggyRate"></p>
        </section>
      </div>
    </div>

    <footer class="app-footer">
      <button class="footer-btn" id="resetMonth">6月の画像データに戻す</button>
      <span class="save-hint" id="saveHint">自動で保存されます</span>
    </footer>
  </div>

  <script src="sync-config.js?v=1.3.0"></script>
  <script src="app.js?v=1.3.0"></script>
</body>
</html>
